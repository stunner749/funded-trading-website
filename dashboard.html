<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">YOURBRAND</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#accounts">Accounts</a>
    <a href="index.html#how-it-works">How It Works</a>
  </nav>

  <a href="index.html" class="login-btn">Logout</a>
</header>

<section class="dashboard-section">

  <div class="dashboard-header">
    <p class="section-label">TRADER DASHBOARD</p>
    <h1>YOUR CHALLENGE</h1>
    <p>Track your funded trading evaluation progress.</p>
  </div>

  <div class="dashboard-grid">

    <div class="dashboard-card">
      <span>Account Size</span>
      <strong>$25,000</strong>
    </div>

    <div class="dashboard-card">
      <span>Current Balance</span>
      <strong>$25,000</strong>
    </div>

    <div class="dashboard-card">
      <span>Profit Target</span>
      <strong>$2,000</strong>
      <small>8% target</small>
    </div>

    <div class="dashboard-card">
      <span>Maximum Loss</span>
      <strong>$2,500</strong>
      <small>10% limit</small>
    </div>

    <div class="dashboard-card">
      <span>Trading Days</span>
      <strong>0 / 5</strong>
    </div>

    <div class="dashboard-card">
      <span>Challenge Status</span>
      <strong class="status-active">Active</strong>
    </div>

  </div>

</section>

</body>
</html>
