<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
.dashboard-section {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 7%;
}

.dashboard-header {
  margin-bottom: 35px;
}

.dashboard-header h1 {
  font-size: 48px;
  margin: 10px 0;
}

.dashboard-header p {
  color: #b8bec9;
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.dashboard-card {
  background: #0d1620;
  border: 1px solid #1b2430;
  border-radius: 14px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.dashboard-card span {
  color: #b8bec9;
  font-size: 15px;
}

.dashboard-card strong {
  font-size: 28px;
}

.dashboard-card small {
  color: #dfff00;
}

@media (max-width: 800px) {
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
}

.progress-bar {
  width: 100%;
  height: 10px;
  background: #1a2633;
  border-radius: 999px;
  margin-top: 16px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #e9ff2f;
  border-radius: 999px;
  transition: width 0.4s ease;
}
#balanceInput {
  margin-top: 18px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #243344;
  background: #0b141e;
  color: white;
  font-size: 16px;
  width: 100%;
  box-sizing: border-box;
}

#balanceInput::placeholder {
  color: #7f8b98;
}

#updateBalanceBtn {
  margin-top: 12px;
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: #e9ff2f;
  color: #000;
  font-weight: 700;
  cursor: pointer;
}
#addTradingDayBtn {
  margin-top: 14px;
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: #e9ff2f;
  color: #000;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
}
</style>
</head>

<body>

<header class="navbar">
  <div class="logo">YOURBRAND</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#accounts">Accounts</a>
    <a href="index.html#how-it-works">How It Works</a>
  </nav>

  <a href="index.html" class="login-btn">Logout</a>
</header>

<section class="dashboard-section">

  <div class="dashboard-header">
    <p class="section-label">TRADER DASHBOARD</p>
    <h1>WELCOME, <span id="userName">TRADER</span></h1>
    <p>Track your funded trading evaluation progress.</p>
  </div>

  <div class="dashboard-grid">

    <div class="dashboard-card">
      <span>Account Size</span>
      <strong>$25,000</strong>
    </div>

   <div class="dashboard-card">
  <span>Current Balance</span>
  <strong id="currentBalanceDisplay">$25,000</strong>

  <input
    type="number"
    id="balanceInput"
    placeholder="Enter new balance"
  >

  <button type="button" id="updateBalanceBtn">
    Update Balance
  </button>
</div>

 <div class="dashboard-card">
  <span>Profit Target</span>
  <strong>$2,000</strong>
  <small>8% target</small>

  <div class="progress-bar">
  <div class="progress-fill" style="width: 0%;"></div>
  </div>
</div>

    <div class="dashboard-card">
      <span>Maximum Loss</span>
      <strong>$2,500</strong>
      <small>10% limit</small>
    </div>

  <div class="dashboard-card">
  <span>Trading Days</span>
  <strong id="tradingDaysDisplay">0 / 5</strong>

  <button type="button" id="addTradingDayBtn">
    Add Trading Day
  </button>
</div>

    <div class="dashboard-card">
      <span>Challenge Status</span>
      <strong class="status-active" id="challengeStatus">Active</strong>
    </div>

  </div>

</section><script src="script.js"></script>

<script>
const selectedAccount = JSON.parse(localStorage.getItem("selectedAccount"));

if (selectedAccount) {
  const cards = document.querySelectorAll(".dashboard-card");

  cards[0].querySelector("strong").textContent = selectedAccount.size;
 const savedBalance = localStorage.getItem("currentBalance");
cards[1].querySelector("strong").textContent = savedBalance ? "$" + Number(savedBalance).toLocaleString() : selectedAccount.size;

  const sizeNumber = Number(selectedAccount.size.replace(/[$,]/g, ""));
  const targetPercent = Number(selectedAccount.target.replace("%", ""));
  const lossPercent = Number(selectedAccount.loss.replace("%", ""));

  const targetAmount = sizeNumber * (targetPercent / 100);
  const lossAmount = sizeNumber * (lossPercent / 100);

  cards[2].querySelector("strong").textContent =
    "$" + targetAmount.toLocaleString();

  cards[2].querySelector("small").textContent =
    selectedAccount.target + " target";

  cards[3].querySelector("strong").textContent =
    "$" + lossAmount.toLocaleString();

  cards[3].querySelector("small").textContent =
    selectedAccount.loss + " limit";

  cards[4].querySelector("strong").textContent =
    "0 / " + selectedAccount.days.replace(" Days", "");}
const cards = document.querySelectorAll(".dashboard-card");

const accountSize = Number(
cards[0].querySelector("strong").textContent.replace(/[$,]/g, ""));
const currentBalance = Number(
  cards[1].querySelector("strong").textContent.replace(/[$,]/g, "")
);

const profitTarget = Number(
  cards[2].querySelector("strong").textContent.replace(/[$,]/g, "")
);
const maximumLoss = Number(
  cards[3].querySelector("strong").textContent.replace(/[$,]/g, "")
);

const challengeStatus = document.getElementById("challengeStatus");
function updateChallengeStatus(balance) {
  if (balance <= accountSize - maximumLoss) {
    challengeStatus.textContent = "Failed";
  } else if (balance >= accountSize + profitTarget) {
    challengeStatus.textContent = "Passed";
  } else {
    challengeStatus.textContent = "Active";
  }
}
  updateChallengeStatus(currentBalance);
const profitProgress = Math.max(
  0,  
Math.min(100, ((currentBalance - accountSize) / profitTarget) * 100)
);
document.querySelector(".progress-fill").style.width =
  profitProgress + "%";
const balanceInput = document.getElementById("balanceInput");
const updateBalanceBtn = document.getElementById("updateBalanceBtn");

updateBalanceBtn.addEventListener("click", function () {
  const newBalance = Number(balanceInput.value);

  if (!newBalance || newBalance <= 0) {
    alert("Please enter a valid balance.");
    return;
  }

  localStorage.setItem("currentBalance", newBalance);

  cards[1].querySelector("strong").textContent =
    "$" + newBalance.toLocaleString();
updateChallengeStatus(newBalance);
  const newProgress = Math.max(
    0,
    Math.min(100, ((newBalance - accountSize) / profitTarget) * 100)
  );

  document.querySelector(".progress-fill").style.width =
    newProgress + "%";

  balanceInput.value = "";
});

const tradingDaysDisplay = document.getElementById("tradingDaysDisplay");
const addTradingDayBtn = document.getElementById("addTradingDayBtn");
let tradingDays = Number(localStorage.getItem("tradingDays")) || 0;

tradingDays = Math.min(tradingDays, 5);

tradingDaysDisplay.textContent = tradingDays + " / 5";
if (tradingDays >= 5) {
  addTradingDayBtn.disabled = true;
  addTradingDayBtn.textContent = "Trading Days Complete";
}
addTradingDayBtn.addEventListener("click", function () {
  if (tradingDays < 5) {
    tradingDays++;
    localStorage.setItem("tradingDays", tradingDays);
    tradingDaysDisplay.textContent = tradingDays + " / 5";
  if (tradingDays >= 5) {
  addTradingDayBtn.disabled = true;
  addTradingDayBtn.textContent = "Trading Days Complete";
}
}    
});
const fullName = localStorage.getItem("fullName");
const loggedInUser = localStorage.getItem("loggedInUser");
const displayName = fullName || (loggedInUser ? loggedInUser.split("@")[0] : "TRADER");

document.getElementById("userName").textContent = displayName;
</script>

</body>
</html>
