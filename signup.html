<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">YOURBRAND</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#accounts">Accounts</a>
      <a href="index.html#how-it-works">How It Works</a>
    </nav>
  </header>

  <section class="signup-section">

    <div class="signup-card">

      <p class="section-label">GET STARTED</p>

      <h1>START YOUR CHALLENGE</h1>

      <p class="signup-description">
        Create your account to continue with your funded trading challenge.
      </p>

     <form id="signupForm">

        <label>Full Name</label>
       <input type="text" id="fullName" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
        <label>Account Size</label>
       <select id="accountSize" required>
          <option>$5,000</option>
          <option>$10,000</option>
          <option>$25,000</option>
          <option>$50,000</option>
          <option>$100,000</option>
        </select>


<button type="submit" class="primary-btn">
  Continue
</button>
</form>
    </div>

  </section>

<script>
document.getElementById("signupForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const accountSize = document.getElementById("accountSize").value;

  localStorage.setItem("selectedAccount", accountSize);

  window.location.href = "checkout.html";
});
</script>
</body>
</html>
