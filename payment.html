<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">YOURBRAND</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#accounts">Accounts</a>
    <a href="index.html#how-it-works">How It Works</a>
  </nav>
</header>

<section class="checkout-section">

  <div class="checkout-card">

    <p class="section-label">SECURE CHECKOUT</p>

    <h1>PAYMENT</h1>

    <div class="checkout-row">
      <span>Challenge</span>
     <strong id="payment-size">$25,000 Account</strong>

    <div class="checkout-total">
   <span>Total <strong id="payment-price">$49</strong></span>
  <a id="payment-button" class="primary-btn" href="success.html">
    Pay $49
</a>

  


  </div>

</section>
<script>
  const selectedAccount = JSON.parse(localStorage.getItem("selectedAccount"));

  if (selectedAccount) {
    document.getElementById("payment-size").textContent =
      selectedAccount.size + " Account";

    document.getElementById("payment-price").textContent =
      selectedAccount.fee;

    document.getElementById("payment-button").textContent =
      "Pay " + selectedAccount.fee;
  }
</script>
</body>
</html>
