<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">YOURBRAND</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#accounts">Accounts</a>
      <a href="index.html#how-it-works">How It Works</a>
    </nav>
  </header>

  <section class="checkout-section">

    <div class="checkout-card">

      <p class="section-label">ORDER SUMMARY</p>

      <h1>YOUR CHALLENGE</h1>

      <div class="checkout-row">
        <span>Account Size</span>
        <strong id="checkout-size">$25,000</strong>
      </div>

      <div class="checkout-row">
        <span>Profit Target</span>
        <strong>8%</strong>
      </div>

      <div class="checkout-row">
        <span>Maximum Loss</span>
        <strong>10%</strong>
      </div>

      <div class="checkout-row">
        <span>Minimum Days</span>
        <strong>5 Days</strong>
      </div>

      <div class="checkout-total">
        <span>Total</span>
        <strong id="checkout-price">$149</strong>
      </div>

  <button class="primary-btn" onclick="window.location.href='payment.html'">   
        Continue to Payment
      </button>

    </div>

  </section>

<script>
const selectedAccount = JSON.parse(
  localStorage.getItem("selectedAccount")
);

if (selectedAccount) {
  const rows = document.querySelectorAll(".checkout-row strong");

  rows[0].textContent = selectedAccount.size;
  rows[1].textContent = selectedAccount.target;
  rows[2].textContent = selectedAccount.loss;
  rows[3].textContent = selectedAccount.days;

  document.getElementById("checkout-price").textContent =
    selectedAccount.fee;
}
</script>
</body>
</html>
